
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Credencial Digital</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="credencial">

    <header class="header">
      <h1>SeCUNDARIA TECNICA NO. 79</h1>
      <p>Credencial digital de estudiante</p>
    </header>

    <section class="perfil">

      <div class="foto-contenedor">
        <img
          src="Imagenes/marla.png"
          alt="Fotografía del estudiante"
          class="foto"
        >
      </div>

      <h2>Marla Saucedo Ceronio</h2>
      <p class="matricula">Matrícula: 2026SACM091201</p>

    </section>

    <section class="informacion">

      <span class="estado">
        <span class="estado-punto"></span>
        ACTIVO
      </span>

      <p class="grado">
        Estudiante del tercer año, grupo F
      </p>

      <div class="vigencia">
        <span class="icono">✓</span>
        Credencial vigente y autorizada
      </div>

    </section>

    <footer>
      Documento de identificación institucional
    </footer>

  </main>

</body>
</html>
